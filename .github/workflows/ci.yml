name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI (Sykli)
    # Hosted, not self-hosted (false-infra#207). Nothing here needs a kernel or
    # a machine we own — it is Elixir, helm and sykli — and a public repository
    # on an org runner lets a fork pull request run code inside the false-infra
    # cluster. Hosted minutes are unlimited and free for public repositories, so
    # this costs nothing; the `azure/setup-helm` pin below is what the ARC image
    # was missing and is kept, because it pins the version helm-unittest needs
    # rather than taking whatever the image ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - uses: azure/setup-helm@v4
        with:
          version: "v3.19.0"   # newest v3: knows platformHooks; v4 forces plugin verification
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git

      - name: Install sykli
        run: curl -fsSL https://raw.githubusercontent.com/yairfalse/sykli/main/install.sh | bash

      - name: Run sykli
        run: ~/.local/bin/sykli

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.ci.result }}" == "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "All checks passed"
